<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome | Mehik Kumari Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background-color: #030611;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #ffffff;
    }

    /* Full-Screen Premium Cyber Ambient Wrapper */
    .splash-wrapper {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 20% 35%, #0b1a3a 0%, #040714 50%, #020308 100%);
      overflow: hidden;
      opacity: 1;
      transition: opacity 0.65s cubic-bezier(0.4, 0, 0.2, 1), transform 0.65s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Left Upper Blue Glowing Ambient Light */
    .ambient-glow-left {
      position: absolute;
      top: 15%;
      left: 10%;
      width: 650px;
      height: 650px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(29, 78, 216, 0.32) 0%, rgba(14, 165, 233, 0.12) 45%, transparent 70%);
      filter: blur(100px);
      pointer-events: none;
    }

    /* Bottom Right Purple Glow */
    .ambient-glow-right {
      position: absolute;
      bottom: 10%;
      right: 15%;
      width: 550px;
      height: 550px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(147, 51, 234, 0.18) 0%, rgba(236, 72, 153, 0.08) 50%, transparent 70%);
      filter: blur(95px);
      pointer-events: none;
    }

    /* 3D Plexus Landscape Canvas */
    #plexus-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    /* Centered Typography Content */
    .splash-content {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 2rem 1.5rem;
      max-width: 760px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: splashContentEntrance 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes splashContentEntrance {
      from {
        opacity: 0;
        transform: translateY(22px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .welcome-eyebrow {
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      color: #94a3b8;
      margin-bottom: 0.65rem;
    }

    .welcome-intro-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(2.8rem, 6vw, 4.5rem);
      font-weight: 700;
      line-height: 1.15;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.35em;
      flex-wrap: wrap;
    }

    .welcome-intro-title .title-serif-white {
      color: #ffffff;
      text-shadow: 0 0 35px rgba(255, 255, 255, 0.35);
    }

    .welcome-intro-title .title-serif-gradient {
      background: linear-gradient(135deg, #7dd3fc 0%, #c084fc 60%, #f472b6 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 40px rgba(192, 132, 252, 0.35);
    }

    .welcome-divider {
      width: 65px;
      height: 3px;
      background: linear-gradient(90deg, #2563eb 0%, #e879f9 100%);
      border-radius: 4px;
      margin-top: 1.25rem;
      box-shadow: 0 0 16px rgba(232, 121, 249, 0.75);
    }

    /* Fade-out class applied before redirect */
    .splash-wrapper.fade-out {
      opacity: 0;
      transform: scale(0.98);
    }

    @media (max-width: 600px) {
      .welcome-eyebrow {
        font-size: 0.8rem;
        letter-spacing: 0.08em;
      }
      .welcome-intro-title {
        font-size: 2.2rem;
        gap: 0.25em;
      }
      .welcome-divider {
        width: 55px;
        height: 3px;
        margin-top: 1rem;
      }
    }
  </style>
</head>
<body>

  <div id="splash-wrapper" class="splash-wrapper">
    <div class="ambient-glow-left"></div>
    <div class="ambient-glow-right"></div>
    <canvas id="plexus-canvas"></canvas>

    <div class="splash-content">
      <div class="welcome-eyebrow">Welcome to My</div>
      <h1 class="welcome-intro-title">
        <span class="title-serif-white">Portfolio</span>
        <span class="title-serif-gradient">Website</span>
      </h1>
      <div class="welcome-divider"></div>
    </div>
  </div>

  <script>
    (function() {
      // 3D Perspective Plexus Landscape Grid Canvas
      const canvas = document.getElementById('plexus-canvas');
      if (canvas) {
        const ctx = canvas.getContext('2d');
        let width, height;
        let time = 0;
        let isTabVisible = true;

        document.addEventListener('visibilitychange', function() {
          isTabVisible = document.visibilityState === 'visible';
        });

        function resizeCanvas() {
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        }

        function animatePlexus() {
          if (!isTabVisible) {
            requestAnimationFrame(animatePlexus);
            return;
          }
          ctx.clearRect(0, 0, width, height);
          time += 0.009;

          const cols = 32;
          const rows = 24;
          const spacingX = width / 13;
          const spacingZ = 45;
          const fov = 380;

          const grid = [];

          for (let r = 0; r < rows; r++) {
            grid[r] = [];
            const z = (rows - r) * spacingZ;
            const scale = fov / (fov + z);

            for (let c = 0; c < cols; c++) {
              const x = (c - cols / 2) * spacingX;
              const wave = Math.sin(x * 0.003 + time * 1.4) * 65 + Math.cos(z * 0.008 + time * 1.1) * 55;
              const y = 100 + wave;

              const projX = width / 2 + x * scale;
              const projY = height / 2 + y * scale + (r * 11);
              const alpha = Math.max(0.12, Math.min(0.9, (1 - z / 1200)));

              grid[r][c] = { x: projX, y: projY, z: z, alpha: alpha };
            }
          }

          for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
              const p = grid[r][c];

              if (c < cols - 1) {
                const pRight = grid[r][c + 1];
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(pRight.x, pRight.y);
                ctx.strokeStyle = `rgba(59, 130, 246, ${p.alpha * 0.85})`;
                ctx.lineWidth = 1.05 * (fov / (fov + p.z));
                ctx.stroke();
              }

              if (r < rows - 1) {
                const pDown = grid[r + 1][c];
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(pDown.x, pDown.y);
                ctx.strokeStyle = `rgba(139, 92, 246, ${p.alpha * 0.75})`;
                ctx.lineWidth = 1.05 * (fov / (fov + p.z));
                ctx.stroke();
              }

              if (r % 2 === 0 && c % 2 === 0) {
                ctx.beginPath();
                ctx.arc(p.x, p.y, Math.max(1.5, 2.5 * (fov / (fov + p.z))), 0, Math.PI * 2);
                ctx.fillStyle = p.alpha > 0.35 ? '#38bdf8' : '#60a5fa';
                ctx.shadowBlur = p.alpha > 0.35 ? 12 : 5;
                ctx.shadowColor = '#38bdf8';
                ctx.fill();
                ctx.shadowBlur = 0;
              }
            }
          }

          requestAnimationFrame(animatePlexus);
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        animatePlexus();
      }

      // Smooth Fade-out & Redirect after 3.0 Seconds
      const wrapper = document.getElementById('splash-wrapper');
      setTimeout(function() {
        if (wrapper) wrapper.classList.add('fade-out');
        setTimeout(function() {
          try {
            console.log('[Splash Screen] Setting sessionStorage.setItem("splashShown", "true")...');
            sessionStorage.setItem('splashShown', 'true');
          } catch(e) {
            console.error('[Splash Screen] Error setting sessionStorage:', e);
          }
          console.log('[Splash Screen] Redirecting back to index.html...');
          window.location.replace('index.html');
        }, 600);
      }, 3000);
    })();
  </script>
</body>
</html>
